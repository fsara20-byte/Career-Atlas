name: Publish international events and Career Atlas
on:
  push:
    branches: [main]
    paths:
      - 'events.html'
      - 'data/events.json'
      - 'index.html'
      - 'index.template.html'
      - '.github/workflows/publish-events.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: career-atlas-update-and-deploy
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest site
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload complete static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
